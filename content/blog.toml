type = "card"
title = "Blog"
description = "Write-ups on recent work from our group on multi-agent large language models, and read-throughs of papers we found worth the time."

[[items]]
title = "Kimi K3: Scaling Both Axes at Once"
subtitle = "Paper read-through — a 2.8T open MoE with a 1M-token context"
date = "2026"
href = "/blog/kimi-k3"
content = "Open models have been scaling test-time compute while their pre-trained foundations sat still. Kimi K3 pushes both at once: 2.8T parameters, native vision, and a million-token context window. The architecture is elegant — linear attention with a bounded decay gate, attention over depth, 896 experts balanced by quantile matching — but the real story is the infrastructure that makes million-token agentic RL affordable."
tags = ["Paper Reading", "LLM", "Mixture-of-Experts", "Long Context", "Systems"]

[[items]]
title = "DeepSeek-V4: Making a Million Tokens Affordable"
subtitle = "Paper read-through — compressing and sparsifying attention to the frontier"
date = "2026"
href = "/blog/deepseek-v4"
content = "Test-time scaling runs straight into attention's quadratic cost. DeepSeek-V4 interleaves two new attention mechanisms — one that compresses then sparsifies, one that compresses far harder but stays dense — to serve a million-token context at 27% of the FLOPs and 10% of the KV cache of its predecessor, plus an unusually honest account of the loss spikes along the way."
tags = ["Paper Reading", "LLM", "Attention", "Long Context", "Efficiency"]

[[items]]
title = "AURORA: Teaching LLM Agents When to Hit Undo"
subtitle = "Attention-based dual verification for reliable rollback"
date = "2026"
href = "/blog/aurora"
content = "When an LLM agent takes a wrong step on a long task, the fix is to roll back — but knowing when is the hard part. AURORA reads attention patterns over the agent's trajectory to produce two signals, physical validity and overall coherence, and triggers a rollback only when one of them fires — recovering more tasks with fewer interventions."
tags = ["LLM Agents", "Embodied AI", "Verification", "Reasoning"]

[[items]]
title = "LangMARL: Giving Each LLM Agent Its Own Performance Review"
subtitle = "Credit assignment for teams of LLM agents"
date = "2026"
href = "/blog/langmarl"
content = "When a team of LLM agents fails, who should change what? LangMARL ports credit assignment from multi-agent reinforcement learning into language space: a centralized critic reads the whole episode and writes agent-specific feedback, driving a language-form actor–critic loop that improves coordination, scales to large teams, and grows complementary roles nobody assigned."
tags = ["LLM Agents", "Multi-Agent", "Reinforcement Learning", "Credit Assignment"]

[[items]]
title = "CoMAL: Can LLM Agents Talk Their Way Out of a Traffic Jam?"
subtitle = "Multi-agent LLMs for mixed-autonomy traffic"
date = "2026"
href = "/blog/comal"
content = "A handful of well-behaved autonomous vehicles can smooth out stop-and-go waves for everyone. CoMAL builds each vehicle as an LLM agent that perceives the road, negotiates roles in a shared message pool, and drives through a rule-based controller — beating human drivers and rivaling reinforcement learning, while staying interpretable."
tags = ["LLM Agents", "Autonomous Driving", "Multi-Agent", "Reinforcement Learning"]

[[items]]
title = "Instructional Agents: A Faculty Meeting Inside an LLM"
subtitle = "Multi-agent LLMs for automated course design"
date = "2026"
href = "/blog/instructional-agents"
content = "Preparing a coherent course — objectives, syllabus, slides, scripts, assessments — usually takes a whole team. Instructional Agents simulates that team with role-specialized LLM agents working through the ADDIE framework, producing classroom-ready material for under a dollar, with a dial for how much human oversight you want."
tags = ["LLM Agents", "Education", "Multi-Agent", "AI for Education"]
